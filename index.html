    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --black: #080808;
            --white: #ffffff;
            --off-white: #f5f5f2;
            --gray: #777777;
            --light-gray: #dddddd;
            --accent: #0C4DA2; /* Guires Brand Blue (guires.com CTA blue) */
            --accent-secondary: #29539B; /* Guires Brand Navy (guires.com header/structural blue) */
        }
    }

    @layer base {
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--white);
            color: var(--black);
            overflow-x: hidden;
            cursor: default;
        }
        
        h1, h2, h3, h4, h5, h6 {
            letter-spacing: -0.02em;
        }

        ::selection {
            background-color: var(--accent-secondary);
            color: var(--white);
        }
    }

    @layer components {
        .nav-link {
            @apply text-sm font-medium tracking-wide text-gray-600 hover:text-black transition-colors duration-300 relative;
        }
        .nav-link::after {
            content: '';
            @apply absolute left-0 -bottom-1 w-0 h-[1px] bg-[var(--accent)] transition-all duration-300;
        }
        .nav-link:hover::after {
            @apply w-full;
        }
        
        .btn-primary {
            @apply px-6 py-3 bg-[var(--accent)] text-white text-sm font-medium hover:bg-blue-800 transition-colors duration-300 inline-flex items-center gap-2;
        }
        
        .btn-outline {
            @apply px-6 py-3 border border-black/20 text-black text-sm font-medium hover:bg-black/5 transition-colors duration-300 inline-flex items-center gap-2;
        }
    }

    @layer utilities {
        .text-balance {
            text-wrap: balance;
        }
        .clip-text-reveal {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
        }
    }

    .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
    }
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }

    @keyframes marquee {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
        width: 8px;
    }
    ::-webkit-scrollbar-track {
        background: var(--white);
    }
    ::-webkit-scrollbar-thumb {
        background: #ccc;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #999;
    }
    </style>
</head>
