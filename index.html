    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --black: #080808;
            --white: #ffffff;
            --off-white: #f5f5f2;
            --gray: #777777;
            --light-gray: #dddddd;
            --accent: #0C4DA2; /* Guires Brand Blue (guires.com CTA blue) */
            --accent-secondary: #29539B; /* Guires Brand Navy (guires.com header/structural blue) */
            --tint-1: #EEF3FA;
            --tint-2: #DCE8F5;
        }
    }

    @layer base {
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--white);
            color: var(--black);
            overflow-x: hidden;
            cursor: default;
        }
        
        h1, h2, h3, h4, h5, h6 {
            letter-spacing: -0.02em;
        }

        ::selection {
            background-color: var(--accent-secondary);
            color: var(--white);
        }
    }

    @layer components {
        .nav-link {
            @apply text-sm font-medium tracking-wide text-gray-600 hover:text-black transition-colors duration-300 relative;
        }
        .nav-link::after {
            content: '';
            @apply absolute left-0 -bottom-1 w-0 h-[1px] bg-[var(--accent)] transition-all duration-300;
        }
        .nav-link:hover::after {
            @apply w-full;
        }
        
        .btn-primary {
            @apply px-6 py-3 bg-[var(--accent)] text-white text-sm font-medium hover:bg-blue-800 transition-colors duration-300 inline-flex items-center gap-2;
        }
        
        .btn-outline {
            @apply px-6 py-3 border border-black/20 text-black text-sm font-medium hover:bg-black/5 transition-colors duration-300 inline-flex items-center gap-2;
        }
    }

    @layer utilities {
        .text-balance {
            text-wrap: balance;
        }
        .clip-text-reveal {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
        }
    }

    .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
    }
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }

    @keyframes marquee {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
        width: 8px;
    }
    ::-webkit-scrollbar-track {
        background: var(--white);
    }
    ::-webkit-scrollbar-thumb {
        background: #ccc;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #999;
    }
    </style>
    <style>
        .hero-sparkle {
            position: absolute; border-radius: 9999px; background: #cfe0ff;
            opacity: 0; animation: sparkleTwinkle 4s ease-in-out infinite;
        }
        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.9; }
        }
        .hero-gradient-text {
            background: linear-gradient(90deg, #FF7A3D, #E8352B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .hero-gradient-text-blue {
            background: linear-gradient(90deg, #5AB6FF, #0C4DA2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .hero-dusk-sky {
            background:
                radial-gradient(60% 50% at 75% 15%, rgba(62,123,214,0.35), transparent 70%),
                linear-gradient(180deg, #0A1B33 0%, #071527 45%, #050B18 100%);
        }
        .hero-trail {
            filter: drop-shadow(0 0 6px rgba(90,182,255,0.7));
        }
        .hero-ribbon { animation: ribbonDrift 26s ease-in-out infinite alternate; transform-origin: center; }
        @keyframes ribbonDrift {
            0%   { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(6deg) scale(1.05); }
        }
        .brand-marquee-mask {
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
        }
        .brand-marquee-track {
            animation: brandMarquee 22s linear infinite;
        }
        .brand-marquee-track:hover {
            animation-play-state: paused;
        }
        @keyframes brandMarquee {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        .brand-card {
            flex: 0 0 auto;
            min-width: 220px;
            height: 90px;
            border-radius: 0.75rem;
            background: #F1F4F8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1.5rem;
        }
        .brand-card-text {
            font-weight: 600;
            font-size: 1.05rem;
            color: #4B5563;
            white-space: nowrap;
        }
    </style>
</head>
