<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Open Positions | Careers at GUIRES</title>
    <meta name="description" content="Browse open roles at GUIRES across engineering, data, design, business and research. Filter by employment type, department, location and experience level.">

    <!-- React & Babel -->
    <script src="https://guiresfrl.github.io/guires_website/vendor/react/react.production.min.js?v=1"></script>
    <script src="https://guiresfrl.github.io/guires_website/vendor/react/react-dom.production.min.js?v=1"></script>
    <script src="https://guiresfrl.github.io/guires_website/vendor/babel/babel.min.js?v=1"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <link href="https://guiresfrl.github.io/guires_website/vendor/lucide/lucide.css?v=1" rel="stylesheet">

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --cw-bg: #ffffff;
            --cw-surface: #FFFFFF;
            --cw-surface-2: #F3F2EE;
            --cw-ink: #010120;
            --cw-text: #14181F;
            --cw-muted: #6B7280;
            --cw-border: #E7E4DF;
            --cw-accent: #da2e0f;
            --cw-accent-dark: #c41112;
            --cw-accent-secondary: #c41112;
            --cw-accent-light: #74d4fc;
        }
    }
    @layer base {
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cw-bg);
            color: var(--cw-text);
            overflow-x: hidden;
        }
        h1, h2, h3, h4, h5, h6 { letter-spacing: -0.02em; }
        ::selection { background-color: var(--cw-accent); color: #fff; }
    }
    @layer utilities {
        .text-balance { text-wrap: balance; }
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--cw-bg); }
    ::-webkit-scrollbar-thumb { background: #ccc; }
    ::-webkit-scrollbar-thumb:hover { background: #999; }
    </style>
    <style>
        @keyframes cwFloatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-16px); } }
        @keyframes cwFloatSlower { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(12px); } }
        .cw-float-slow { animation: cwFloatSlow 7s ease-in-out infinite; }
        .cw-float-slower { animation: cwFloatSlower 9s ease-in-out infinite; }
        .cw-btn-arrow:hover .icon-arrow-right { transform: translateX(4px); }
        @media (prefers-reduced-motion: reduce) {
            .cw-float-slow, .cw-float-slower { animation: none !important; }
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
        }
    </style>
    <link href="https://guiresfrl.github.io/guires_website/assets/together.css?v=2" rel="stylesheet">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="https://guiresfrl.github.io/guires_website/components/ErrorBoundary.js?v=1"></script>
    <script type="text/babel" src="https://guiresfrl.github.io/guires_website/careers/data/jobsData.js?v=2"></script>
    <script type="text/babel" src="https://guiresfrl.github.io/guires_website/careers/components/CareersHeader.js?v=2"></script>
    <script type="text/babel" src="https://guiresfrl.github.io/guires_website/careers/components/CareersFooter.js?v=2"></script>
    <script type="text/babel" src="https://guiresfrl.github.io/guires_website/careers/components/FilterBar.js?v=3"></script>
    <script type="text/babel" src="https://guiresfrl.github.io/guires_website/careers/components/JobCard.js?v=4"></script>
    <script type="text/babel" src="https://guiresfrl.github.io/guires_website/careers/pages/JobsListing.js?v=4"></script>
    <script type="text/babel">
        function App() {
            return (
                <div className="min-h-screen bg-[var(--cw-bg)] text-[var(--cw-text)] font-sans">
                    <CareersHeader />
                    <main>
                        <JobsListingPage />
                    </main>
                    <CareersFooter />
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
        function cwRefreshST() { if (window.ScrollTrigger) ScrollTrigger.refresh(); }
        window.addEventListener('load', cwRefreshST);
        setTimeout(cwRefreshST, 300);
    </script>
</body>
</html>
