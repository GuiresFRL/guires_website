            --accent: #0C4DA2; --accent-secondary: #29539B;

    @layer base {
        body { font-family: 'Inter', sans-serif; background-color: var(--white); color: var(--black); overflow-x: hidden; cursor: default; }

    }

    ::-webkit-scrollbar-track { background: var(--white); }
