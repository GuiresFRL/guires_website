    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --black: #14202B;
            --white: #ffffff;
            --off-white: #f5f5f2;
            --gray: #777777;
            --light-gray: #dddddd;
            --accent: #da2e0f;
            --accent-secondary: #c41112;
            --accent-cyan: #19D3E6;
            --ink-navy: #071A2B;
            --muted: #64748B;
            --bg-soft: #F7F9FC;
        }
    }

    @layer base {
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--white);
            color: var(--black);
            overflow-x: hidden;
            cursor: default;
        }

        h1, h2, h3, h4, h5, h6 {
            letter-spacing: -0.02em;
        }

        ::selection {
            background-color: var(--accent-secondary);
            color: var(--white);
        }
    }

    @layer components {
        .nav-link {
            @apply text-sm font-medium tracking-wide text-gray-600 hover:text-black transition-colors duration-300 relative;
        }
        .nav-link::after {
            content: '';
            @apply absolute left-0 -bottom-1 w-0 h-[1px] bg-[var(--accent)] transition-all duration-300;
        }
        .nav-link:hover::after {
            @apply w-full;
        }

        .btn-primary {
            @apply px-6 py-3 bg-[var(--accent)] text-white text-sm font-medium hover:bg-blue-800 transition-colors duration-300 inline-flex items-center gap-2;
        }

        .btn-outline {
            @apply px-6 py-3 border border-black/20 text-black text-sm font-medium hover:bg-black/5 transition-colors duration-300 inline-flex items-center gap-2;
        }
    }

    @layer utilities {
        .text-balance {
            text-wrap: balance;
        }
        .clip-text-reveal {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
        }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
        width: 8px;
    }
    ::-webkit-scrollbar-track {
        background: var(--white);
    }
    ::-webkit-scrollbar-thumb {
        background: #ccc;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #999;
    }
    </style>
    <style>
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
    <link href="https://guiresfrl.github.io/guires_website/assets/together.css?v=2" rel="stylesheet">
    <link href="https://guiresfrl.github.io/guires_website/assets/services-theme.css?v=1" rel="stylesheet">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="https://guiresfrl.github.io/guires_website/components/services/detail/WhyGuiresSection.js?v=1"></script>

    <script type="text/babel" src="https://guiresfrl.github.io/guires_website/components/services/detail/ServiceCaseStudyDetail.js?v=1"></script>

    <script type="text/babel">
        function App() {
            return (
                <div className="min-h-screen bg-white text-[var(--black)] selection:bg-[var(--accent-secondary)] selection:text-white font-sans">
                    <Header />
                    <main>
                        <ServiceDetailPage slug="biostatistics" />
                    </main>
                    <Footer />
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
        function svdRefreshST() { if (window.ScrollTrigger) ScrollTrigger.refresh(); }
        window.addEventListener('load', svdRefreshST);
        setTimeout(svdRefreshST, 300);
    </script>
</body>
